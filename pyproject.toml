[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grafting-ocfda"
version = "0.1.0"
description = "Experimental implementation of Grafting using Ownership-Constrained FFN Delta Adaptation (OCFDA)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {file = "LICENSE"}
authors = [
  {name = "Amantur Saliev"},
]
dependencies = [
  "accelerate>=1.3,<1.4",
  "datasets>=3.2,<3.3",
  "fire>=0.7,<0.8",
  "numpy>=1.26,<3",
  "pandas>=2.2,<2.3",
  "peft>=0.14,<0.15",
  "protobuf>=5,<6",
  "safetensors>=0.5,<0.6",
  "scipy>=1.12,<2",
  "sentencepiece>=0.2,<0.3",
  "torch>=2.5,<2.7",
  "tqdm>=4.66,<5",
  "transformers>=4.48,<4.49",
]

[project.optional-dependencies]
rosa = ["bitsandbytes>=0.45,<0.46; platform_system == 'Linux'"]
tracking = ["wandb>=0.19,<0.20"]
analysis = ["matplotlib>=3.9,<4"]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[project.urls]
Repository = "https://github.com/Hinedes/Grafting-OCFDA"

[project.scripts]
supertuning-math = "fine_tuning.math_experiment_tables:main"
supertuning-launch = "fine_tuning.launch_math_methods:main"
supertuning-profile = "fine_tuning.profile_efficiency:main"
supertuning-eval = "fine_tuning.evaluate_checkpoint:main"
supertuning-data-audit = "fine_tuning.data_integrity:main"
grafting-b1 = "fine_tuning.run_b1:main"

[tool.setuptools]
py-modules = ["dense_plus_sparse_linear", "dense_plus_sparse_linear_plus_lora"]

[tool.setuptools.packages.find]
where = ["."]
include = ["fine_tuning*", "src*"]
namespaces = true

[tool.setuptools.package-data]
fine_tuning = [
  "dataset/*/*.json",
  "ft-training_set/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["fine_tuning/rosa/rosa"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]