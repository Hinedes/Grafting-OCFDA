name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Compile entry points
        run: |
          python -m py_compile \
            fine_tuning/finetune.py \
            fine_tuning/math_experiment_tables.py \
            fine_tuning/launch_math_methods.py \
            fine_tuning/evaluate_checkpoint.py \
            fine_tuning/data_integrity.py \
            fine_tuning/profile_efficiency.py
      - name: Check decontaminated Math7K split
        run: supertuning-data-audit --train_data fine_tuning/ft-training_set/math_7k.json --require_disjoint
      - name: Run tests
        run: pytest
